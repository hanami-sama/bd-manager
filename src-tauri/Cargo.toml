[package]
name = "bd-manager"
version = "0.1.0"
description = "Bilibili Download Manager"
authors = ["hanami"]
edition = "2021"

[lib]
name = "bd_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

